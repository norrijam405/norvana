<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Market Era</title>
  <desc id="desc">Acre Era Market launch graphic celebrating food and the people behind it.</desc>
  <rect width="1080" height="1350" fill="#526642"/>
  <circle cx="830" cy="180" r="240" fill="#E8C68A" opacity=".26"/>
  <text x="80" y="105" fill="#E8C68A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="6">MARKET ERA</text>
  <text x="80" y="280" fill="#F6F1E7" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900">FOOD HAS</text>
  <text x="80" y="385" fill="#F6F1E7" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900">PEOPLE</text>
  <text x="80" y="490" fill="#E8C68A" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900">BEHIND IT.</text>

  <g transform="translate(80 640)">
    <rect width="430" height="190" rx="34" fill="#F6F1E7"/>
    <text x="34" y="68" fill="#526642" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">GROWERS + MAKERS</text>
    <text x="34" y="118" fill="#2F3026" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Real stories.</text>
    <text x="34" y="158" fill="#6F7068" font-family="Arial, Helvetica, sans-serif" font-size="25">Real availability.</text>
  </g>
  <g transform="translate(570 640)">
    <rect width="430" height="190" rx="34" fill="#E8E9D9"/>
    <text x="34" y="68" fill="#526642" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">LOCAL ROUTES</text>
    <text x="34" y="118" fill="#2F3026" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Pickup. Delivery.</text>
    <text x="34" y="158" fill="#6F7068" font-family="Arial, Helvetica, sans-serif" font-size="25">Evidence before promises.</text>
  </g>

  <path d="M0 1020C218 925 394 970 571 1022s320 78 509 13v315H0Z" fill="#2F3026" opacity=".72"/>
  <text x="80" y="1175" fill="#F6F1E7" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Fresh + useful.</text>
  <text x="80" y="1230" fill="#F6F1E7" opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="27">Explore Market Era at acreera.com</text>
</svg>