name: Acre Era Intelligence Delivery R0

on:
  push:
    branches:
      - "feature/2026-10-04-acre-era-intelligence-delivery-r0"
  pull_request:
    branches:
      - "feature/2026-10-04-acre-era-cinematic-renderer-r0"

permissions:
  contents: read

jobs:
  intelligence-delivery-r0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/intelligence_delivery_ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Intelligence + delivery tests
        run: npm run test:intelligence-delivery

      - name: Existing route engine regression
        run: npm run test:intent-routes

      - name: Watchtower intelligence regression
        run: npm run test:watchtower-signals

      - name: Era Engine regression
        run: npm run test:era-engine
