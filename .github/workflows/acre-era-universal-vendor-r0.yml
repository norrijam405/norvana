name: Acre Era Universal Vendor Guard R0
on:
  push:
    branches:
      - feature/2026-10-13-acre-era-universal-vendor-qualification-r0
  pull_request:
    branches:
      - feature/2026-10-04-acre-era-intelligence-delivery-r0
permissions:
  contents: read
jobs:
  vendor-placement-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/acre-era-universal-vendor-placement-r0.test.mjs
      - run: npm run test:intent-routes
      - run: npm run test:era-engine
