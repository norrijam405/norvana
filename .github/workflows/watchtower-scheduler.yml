name: Norvana Watchtower Scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norvana-watchtower-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WATCHTOWER_TICK_URL: ${{ vars.NORVANA_WATCHTOWER_TICK_URL }}
      WATCHTOWER_SECRET: ${{ secrets.NORVANA_WATCHTOWER_CRON_SECRET }}
    steps:
      - name: Wake Norvana Watchtower
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WATCHTOWER_TICK_URL}" ]; then
            echo "Watchtower tick URL is not configured; scheduler remains inert."
            exit 0
          fi

          if [ -z "${WATCHTOWER_SECRET}" ]; then
            echo "Watchtower cron secret is not configured; scheduler remains inert."
            exit 0
          fi

          case "${WATCHTOWER_TICK_URL}" in
            https://*) ;;
            *)
              echo "Watchtower tick URL must use HTTPS; scheduler remains inert."
              exit 1
              ;;
          esac

          curl --fail-with-body --silent --show-error             --max-time 30             --request POST             --header "x-norvana-watchtower-cron-secret: ${WATCHTOWER_SECRET}"             "${WATCHTOWER_TICK_URL}"
