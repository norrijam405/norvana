name: Norvana Watchtower External Harness

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_DETERMINISTIC_HARNESS"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: norvana-watchtower-external-harness
  cancel-in-progress: false

jobs:
  deterministic-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NORVANA_WATCHTOWER_BASE_URL: https://norvana-lgue82el4-norrijam405-2107s-projects.vercel.app
      NORVANA_WATCHTOWER_HARNESS_ENABLED: "true"
    steps:
      - name: Verify explicit harness gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_DETERMINISTIC_HARNESS"
          test "${NORVANA_WATCHTOWER_BASE_URL}" = "https://norvana-lgue82el4-norrijam405-2107s-projects.vercel.app"
          test "${NORVANA_WATCHTOWER_HARNESS_ENABLED}" = "true"

      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(printf '%s' "${response}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact OIDC-hardened harness client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3df5b173b67459af648deb09c3436f3eed69eb83

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run deterministic external harness
        env:
          NORVANA_VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/watchtower-worker-harness.mjs
