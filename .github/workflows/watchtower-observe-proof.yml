name: Norvana Watchtower Real Observe Proof

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_LOCAL_PRODUCER_OBSERVE_PROOF"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: norvana-watchtower-real-observe-proof
  cancel-in-progress: false

jobs:
  local-producer-observe-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NORVANA_WATCHTOWER_OBSERVE_PROOF_BASE_URL: ${{ vars.NORVANA_WATCHTOWER_OBSERVE_PROOF_BASE_URL }}
      NORVANA_WATCHTOWER_OBSERVE_PROOF_ENABLED: ${{ vars.NORVANA_WATCHTOWER_OBSERVE_PROOF_ENABLED }}
    steps:
      - name: Verify explicit observe-proof gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_LOCAL_PRODUCER_OBSERVE_PROOF"
          test "${NORVANA_WATCHTOWER_OBSERVE_PROOF_ENABLED}" = "true"
          case "${NORVANA_WATCHTOWER_OBSERVE_PROOF_BASE_URL}" in
            https://*) ;;
            *) echo "Observe-proof base URL must be HTTPS."; exit 1 ;;
          esac

      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: oidc
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/norrijam405")"
          TOKEN="$(printf '%s' "${RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).value;if(!v)process.exit(1);process.stdout.write(v)})')"
          test -n "${TOKEN}"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run one-shot Local Producer Watch observe proof
        env:
          NORVANA_VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/watchtower-observe-proof.mjs
