name: Norvana Recovery Lockfile Bootstrap

on:
  push:
    branches:
      - "recovery/**"
    paths:
      - ".github/workflows/recovery-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: norvana-recovery-lockfile
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate package lock only
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; nothing to do."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "No lockfile change to commit."
            exit 0
          fi

          git add package-lock.json
          if [ "$(git diff --cached --name-only)" != "package-lock.json" ]; then
            echo "Refusing to commit anything except package-lock.json."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock recovery dependency graph"
          git push origin "HEAD:${{ github.ref_name }}"
