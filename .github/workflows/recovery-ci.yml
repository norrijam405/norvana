name: Norvana Recovery CI

on:
  push:
    branches:
      - "recovery/**"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: norvana-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency high-severity gate
        run: npm audit --audit-level=high
      - name: Reject obvious current-tree secret regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude='*.md' 'postgres(ql)?://' src .env.example drizzle.config.ts next.config.ts package.json tsconfig.json 2>/dev/null; then
            echo "Potential database URL literal found in executable/config tree."
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next 'ADMIN_PASSWORD[[:space:]]*=' src; then
            echo "Client-side ADMIN_PASSWORD regression found."
            exit 1
          fi
      - name: Watchtower policy tests
        run: npm run test:watchtower
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
