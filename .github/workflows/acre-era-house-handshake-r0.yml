name: Acre Era House Handshake R0

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  house-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: House v1 protocol and replay tests
        run: node --experimental-strip-types --test tests/house-app-handshake.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint House handshake files
        run: npx eslint src/lib/house-app-handshake.ts src/app/api/house/v1/handshake/route.ts tests/house-app-handshake.test.ts
      - name: Full-repository lint baseline (informational; existing unrelated failures)
        run: npm run lint
        continue-on-error: true
